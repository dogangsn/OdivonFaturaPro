<div class="min-h-screen bg-slate-50 flex flex-col">
    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-4 bg-white border-b border-slate-200 shadow-sm">
        <div class="flex items-center gap-2 text-primary">
            <img src="/odivon-violet-loop.png" alt="" class="w-8 h-8 object-contain">
            <span class="text-xl font-black tracking-tight">Odivon <span class="text-slate-900">FaturaPro</span></span>
        </div>
        
        <div class="flex items-center gap-3">
            <!-- Dil Seçici -->
            <app-language-switcher></app-language-switcher>
            
            <!-- Loading -->
            <ng-container *ngIf="isLoading()">
                <div class="w-24 h-9 bg-slate-200 rounded-lg animate-pulse"></div>
            </ng-container>

            <!-- Kullanıcı giriş yapmamışsa -->
            <ng-container *ngIf="!isLoading() && !isLoggedIn()">
                <button (click)="goToPricing()"
                    class="text-slate-600 dark:text-slate-300 hover:text-primary px-3 py-2 rounded-lg font-medium transition-colors text-xs sm:text-sm">
                    {{ lang.t('common.pricing') }}
                </button>
                <button (click)="goToRegister()"
                    class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 px-4 py-2 rounded-lg font-semibold hover:bg-slate-200 transition-colors text-xs sm:text-sm">
                    {{ lang.t('auth.register') }}
                </button>
                <button (click)="goToLogin()"
                    class="bg-primary text-white px-5 py-2 rounded-lg font-semibold hover:bg-blue-700 transition-colors text-xs sm:text-sm shadow-sm">
                    {{ lang.t('auth.login') }}
                </button>
            </ng-container>
            
            <!-- Kullanıcı giriş yapmışsa -->
            <ng-container *ngIf="!isLoading() && isLoggedIn()">
                <div class="flex items-center gap-3">
                    <!-- Kullanıcı Bilgisi -->
                    <div class="flex items-center gap-2 px-3 py-1.5 bg-green-50 border border-green-200 rounded-lg">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                        <span class="text-sm font-medium text-green-700">{{ user()?.displayName || user()?.email }}</span>
                    </div>
                    
                    <!-- Panel Butonu -->
                    <button (click)="goToDashboard()"
                        class="bg-primary text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition-colors text-sm flex items-center gap-2">
                        <span class="material-symbols-outlined text-lg">dashboard</span>
                        {{ lang.t('sidebar.dashboard') }}
                    </button>
                    
                    <!-- Çıkış Butonu -->
                    <button (click)="logout()" 
                        class="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                        [title]="lang.t('auth.logoutTitle')">
                        <span class="material-symbols-outlined">logout</span>
                    </button>
                </div>
            </ng-container>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-1 flex flex-col items-center justify-center p-8">
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-3">{{ lang.t('countries.title') }}</h1>
            <p class="text-slate-500 text-lg max-w-xl">{{ lang.t('countries.subtitle') }}</p>
        </div>

        <div class="w-full max-w-5xl">
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <button *ngFor="let country of countries" (click)="selectCountry(country)"
                    class="group flex flex-col items-center p-5 bg-white rounded-xl border-2 border-slate-100 hover:border-primary hover:shadow-lg transition-all duration-200">
                    <div class="w-16 h-11 mb-3 rounded-md overflow-hidden shadow-sm border border-slate-200 group-hover:scale-110 transition-transform bg-slate-100 flex items-center justify-center">
                        <img [src]="country.flagUrl" [alt]="country.defaultName" class="w-full h-full object-cover" />
                    </div>
                    <span class="font-semibold text-slate-700 group-hover:text-primary text-sm text-center">
                        {{ lang.t(country.nameKey) }}
                    </span>
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs sm:text-sm text-slate-400 border-t border-slate-200 bg-white space-y-2">
        <div class="flex items-center justify-center gap-4 text-xs">
            <button (click)="openLegal('terms')" class="hover:text-primary transition-colors cursor-pointer bg-transparent border-0">{{ lang.t('legal.terms') }}</button>
            <span>•</span>
            <button (click)="openLegal('privacy')" class="hover:text-primary transition-colors cursor-pointer bg-transparent border-0">{{ lang.t('legal.privacyCookies') }}</button>
            <span>•</span>
            <button (click)="openLegal('kvkk')" class="hover:text-primary transition-colors cursor-pointer bg-transparent border-0">{{ lang.t('legal.kvkk') }}</button>
        </div>
        <p>{{ lang.t('legal.copyright') }}</p>
    </footer>

    <!-- Legal Modal -->
    <app-legal-modal [isOpen]="showLegalModal" [activeTab]="legalModalTab" (closed)="showLegalModal = false"></app-legal-modal>
</div>
