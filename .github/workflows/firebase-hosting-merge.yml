# Master'a her push: testler -> Firestore kuralları -> Hosting.
# Hosting, kurallar başarıyla yayınlanmadan çıkmaz; yeni kod (ör. fatura sayaçları) yeni kurallara ihtiyaç duyar.

name: Deploy to Firebase on merge
on:
  push:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run test:release
      - run: npm run test:rules

  deploy_rules:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GENERATEINVOICEWEB }}
      - run: npx --yes firebase-tools@14 deploy --only firestore:rules --project generateinvoiceweb --non-interactive

  build_and_deploy:
    needs: deploy_rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GENERATEINVOICEWEB }}
          channelId: live
          projectId: generateinvoiceweb
